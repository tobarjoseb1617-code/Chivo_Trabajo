<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([13.6894, -89.2361], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var marker = L.marker([13.6894, -89.2361], {draggable: true}).addTo(map);

        function updateCoordinates(lat, lng) {
            if (window.Android && typeof window.Android.setCoordinates === 'function') {
                window.Android.setCoordinates(lat, lng);
            }
        }

        marker.on('dragend', function(e) {
            var pos = marker.getLatLng();
            updateCoordinates(pos.lat, pos.lng);
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            map.panTo(e.latlng);
            updateCoordinates(e.latlng.lat, e.latlng.lng);
        });
    </script>
</body>
</html>
